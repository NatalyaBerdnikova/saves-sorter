name: SavesSorter
options:
  bundleIdPrefix: com.example.savessorter
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  knownRegions:
    - ru
    - en
    - Base
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  SavesSorter:
    type: application
    platform: iOS
    sources:
      - path: SharedCore
      - path: Shared
      - path: SavesSorter
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Localization
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: SavesSorter
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SavesSorter/Info.plist
        CODE_SIGN_ENTITLEMENTS: SavesSorter/SavesSorter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: SavesSorter/SavesSorter.entitlements
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SharedCore
      - path: Shared
      - path: ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Localization
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements

  SavesSorterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SavesSorterTests
      - path: SharedCore
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
    dependencies: []

schemes:
  SavesSorter:
    build:
      targets:
        SavesSorter: all
        ShareExtension: all
        SavesSorterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SavesSorterTests
    archive:
      config: Release
